<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=350">
  <title>ProdHub Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <h1 class="header__title">ProdHub</h1>
      <div class="header__status">
        <span id="status-dot" class="status-dot status-dot--gray"></span>
        <span id="status-text" class="status-text">Not configured</span>
      </div>
    </header>

    <section class="section">
      <button id="settings-toggle" class="section__toggle" type="button">
        <span class="section__toggle-icon">&#9654;</span>
        Settings
      </button>
      <div id="settings-panel" class="settings-panel settings-panel--collapsed">
        <div class="form-group">
          <label for="api-url">API URL</label>
          <input id="api-url" type="url" placeholder="http://localhost:3000">
        </div>
        <div class="form-group">
          <label for="api-key">API Key</label>
          <input id="api-key" type="password" placeholder="Enter your API key">
        </div>
        <div class="form-group">
          <label for="device-name">Device Name</label>
          <input id="device-name" type="text" placeholder="Chrome Browser">
        </div>
        <div class="form-group form-group--row">
          <label for="tracking-toggle">Enable Tracking</label>
          <input id="tracking-toggle" type="checkbox" checked>
        </div>
        <button id="save-settings" class="btn btn--primary" type="button">Save</button>
      </div>
    </section>

    <section class="section">
      <h2 class="section__title">Today's Activity</h2>
      <div class="stats">
        <div class="stats__total">
          <span class="stats__label">Total Time</span>
          <span id="total-time" class="stats__value">0h 0m</span>
        </div>
        <div id="top-sites" class="top-sites"></div>
      </div>
    </section>
  </div>

  <script src="../dist/popup.js"></script>
</body>
</html>
