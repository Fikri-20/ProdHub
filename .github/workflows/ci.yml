name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─── Core (Ubuntu) ──────────────────────────────────────────────────────────
  core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install X11 and native build dependencies
        run: sudo apt-get install -y libx11-dev libxtst-dev libpng-dev

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Build backend
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: TypeScript check (root)
        run: npx tsc --noEmit

  # ─── Web Dashboard ──────────────────────────────────────────────────────────
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile --filter web

      - name: Build Next.js
        run: pnpm --filter web build

      - name: Run web tests
        run: pnpm --filter web test

      - name: TypeScript check (web)
        run: npx tsc --noEmit
        working-directory: ./web

  # ─── Browser Extension ──────────────────────────────────────────────────────
  browser-ext:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Install root dependencies (skip native postinstalls)
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          cd browser-extension && pnpm install --frozen-lockfile --ignore-scripts

      - name: Build browser extension
        run: pnpm build:ext

      - name: Verify build output
        run: test -f browser-extension/dist/background.js && test -f browser-extension/dist/popup.js

  # ─── VS Code Extension ──────────────────────────────────────────────────────
  vscode-ext:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Install root dependencies (skip native postinstalls)
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          cd vscode-extension && pnpm install --frozen-lockfile --ignore-scripts

      - name: Build VS Code extension
        run: pnpm build:vscode

      - name: Verify build output
        run: test -f vscode-extension/dist/extension.js

  # ─── Desktop Agent (Windows) ────────────────────────────────────────────────
  desktop-win:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop agent
        run: pnpm build:desktop
